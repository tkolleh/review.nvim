name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plenary.nvim
        run: |
          git clone https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git -C ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim checkout 74b06c6c75e4eeb3108ec01852001636d85a932b

      - name: Install DuckDB CLI
        run: |
          curl -fsSL -o duckdb_cli.zip https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Run tests
        run: just test
